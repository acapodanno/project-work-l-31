name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — BUILD (nessun test)
# I tre job girano in parallelo; ogni componente compila/pacchettizza e carica
# il proprio artefatto binario per le fasi successive.
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1a. Backend (Maven, Spring Boot) ──────────────────────────────────────
  build-backend:
    name: "Build — Backend (Maven, skip tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compila e pacchettizza (senza test)
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Carica artefatto JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ── 1b. Frontend (Angular) ─────────────────────────────────────────────────
  build-frontend:
    name: "Build — Frontend (Angular, produzione)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze
        working-directory: frontend
        run: npm install

      - name: Build di produzione
        working-directory: frontend
        run: npm run build

      - name: Carica artefatto dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 1c. Agente AI (Python) ─────────────────────────────────────────────────
  build-agent:
    name: "Build — Agente AI (pip install)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Installa dipendenze
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Verifica importazione moduli (smoke test)
        working-directory: agent
        env:
          OPENAI_API_KEY: ""
        run: python -c "from src.config import settings; from src.rag.rag_engine import MockQueryEngine; print('Import OK')"


# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — TEST (richiede build OK per ogni componente)
# ─────────────────────────────────────────────────────────────────────────────

  # ── 2a. Test Backend ──────────────────────────────────────────────────────
  test-backend:
    name: "Test — Backend (JUnit + JaCoCo)"
    needs: [build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Esegui test (Maven verify + JaCoCo)
        working-directory: backend
        run: mvn -B verify

      - name: Pubblica report dei test (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

      - name: Pubblica report di copertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          retention-days: 7

  # ── 2b. Test Frontend ─────────────────────────────────────────────────────
  test-frontend:
    name: "Test — Frontend (Karma + Istanbul)"
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze
        working-directory: frontend
        run: npm install

      - name: Esegui test con coverage (Karma headless + Istanbul)
        working-directory: frontend
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessCI --code-coverage

      - name: Pubblica report di copertura (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/healthcare-frontend
          retention-days: 7

  # ── 2c. Test Agente AI ────────────────────────────────────────────────────
  test-agent:
    name: "Test — Agente AI (pytest + eval RAG)"
    needs: [build-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Installa dipendenze
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Esegui test con coverage (modalità offline)
        working-directory: agent
        env:
          OPENAI_API_KEY: ""
        run: pytest -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Valutazione qualità RAG (FAQ)
        working-directory: agent
        env:
          OPENAI_API_KEY: ""
        run: python3 evaluation/eval_faq.py

      - name: Pubblica report di copertura (pytest-cov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage-report
          path: agent/coverage.xml
          retention-days: 7


# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — QUALITÀ (richiede tutti i test OK)
# La scansione sicurezza è gestita dal workflow dedicato codeql.yml
# (CodeQL nativo GitHub) e da Dependabot (aggiornamenti dipendenze automatici).
# Qui rimane solo SonarQube per le metriche di qualità e coverage.
# ─────────────────────────────────────────────────────────────────────────────


  # ── 3b. SonarQube ─────────────────────────────────────────────────────────
  sonarqube-scan:
    name: "Analisi — SonarQube (analisi statica)"
    needs: [test-backend, test-frontend, test-agent]
    runs-on: ubuntu-latest
    # Istanza SonarQube effimera "usa e getta": nessuna persistenza tra un
    # run e l'altro (niente storico/trend), ma sufficiente come quality gate
    # su ogni push/PR. Per uno storico persistente valutare in futuro
    # SonarCloud oppure un'istanza SonarQube self-hosted permanente.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube usa la history git per il blame delle issue

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compila classi backend (senza rieseguire i test)
        working-directory: backend
        run: mvn -B test-compile

      - name: Scarica report coverage backend (JaCoCo)
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco

      - name: Scarica report coverage frontend (lcov)
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/healthcare-frontend

      - name: Scarica report coverage agente (pytest-cov)
        uses: actions/download-artifact@v4
        with:
          name: agent-coverage-report
          path: agent

      - name: Prerequisiti host per l'Elasticsearch embedded in SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072
          ulimit -n 131072

      - name: Avvia SonarQube Community Build
        run: |
          docker run -d --name sonarqube -p 9000:9000 sonarqube:community
          echo "In attesa che SonarQube sia pronto (1-2 minuti)..."
          timeout 180 bash -c '
            until curl -s http://localhost:9000/api/system/status | grep -q "\"status\":\"UP\""; do
              sleep 5
            done
          '

      - name: Genera un token di analisi (credenziali di default, istanza effimera)
        id: sonar-token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-$(date +%s)" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Analisi SonarQube (backend + frontend + agent in un'unica scansione)
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar-token.outputs.token }}

      - name: Ferma il container SonarQube
        if: always()
        run: docker stop sonarqube && docker rm sonarqube
