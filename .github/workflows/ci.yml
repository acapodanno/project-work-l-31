name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot / JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e test (Maven + JaCoCo)
        working-directory: backend
        run: mvn -B clean verify

      - name: Pubblica report dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

      - name: Pubblica report di copertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco

  agent:
    name: Agente AI (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Installa dipendenze
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Esegui i test con coverage (modalità offline, nessuna API key richiesta)
        working-directory: agent
        env:
          OPENAI_API_KEY: ""
        run: pytest -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Valutazione qualità RAG (FAQ)
        working-directory: agent
        env:
          OPENAI_API_KEY: ""
        run: python3 evaluation/eval_faq.py

      - name: Pubblica report di copertura (pytest-cov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage-report
          path: agent/coverage.xml

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze
        working-directory: frontend
        run: npm ci

      - name: Esegui i test con coverage (Karma headless + Istanbul)
        working-directory: frontend
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessCI --code-coverage

      - name: Pubblica report di copertura (Karma/Istanbul)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/healthcare-frontend

      - name: Build di produzione
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Snyk (immagini ufficiali snyk/snyk)
    runs-on: ubuntu-latest
    # Richiede il secret SNYK_TOKEN nelle impostazioni del repository
    # (Settings > Secrets and variables > Actions). Senza il token gli step
    # falliscono singolarmente ma non bloccano la pipeline (continue-on-error),
    # così il job resta "disattivabile" finché non si configura un account Snyk.
    #
    # A differenza delle GitHub Action `snyk/actions/*`, qui usiamo
    # direttamente le immagini Docker ufficiali (hub.docker.com/r/snyk/snyk):
    # ogni tag corrisponde a un toolchain (linguaggio + versione) già pronto,
    # coerente con le versioni usate nei Dockerfile di backend/frontend/agent.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Snyk — dipendenze backend (Maven, JDK 21)
        continue-on-error: true
        run: |
          docker run --rm --env SNYK_TOKEN -v "${{ github.workspace }}/backend:/app" \
            snyk/snyk:maven-3-jdk-21 snyk test --severity-threshold=high

      - name: Snyk — dipendenze frontend (npm, Node 20)
        continue-on-error: true
        run: |
          docker run --rm --env SNYK_TOKEN -v "${{ github.workspace }}/frontend:/app" \
            snyk/snyk:node-20 snyk test --severity-threshold=high

      - name: Snyk — dipendenze agente (pip, Python 3.11)
        continue-on-error: true
        run: |
          docker run --rm --env SNYK_TOKEN -v "${{ github.workspace }}/agent:/app" \
            snyk/snyk:python-3.11 snyk test --severity-threshold=high

      - name: Build immagini runtime (per la scansione container)
        run: |
          docker build -t healthcare-backend:ci --target runtime backend
          docker build -t healthcare-frontend:ci --target runtime frontend
          docker build -t healthcare-agent:ci --target runtime agent

      - name: Snyk — immagine container backend
        continue-on-error: true
        run: |
          docker run --rm --env SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
            snyk/snyk:docker snyk test --docker healthcare-backend:ci --severity-threshold=high

      - name: Snyk — immagine container frontend
        continue-on-error: true
        run: |
          docker run --rm --env SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
            snyk/snyk:docker snyk test --docker healthcare-frontend:ci --severity-threshold=high

      - name: Snyk — immagine container agente
        continue-on-error: true
        run: |
          docker run --rm --env SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
            snyk/snyk:docker snyk test --docker healthcare-agent:ci --severity-threshold=high

  sonarqube-scan:
    name: SonarQube (analisi statica, immagine ufficiale sonarqube:community)
    needs: [backend, frontend, agent]
    runs-on: ubuntu-latest
    # Istanza SonarQube effimera "usa e getta": nessuna persistenza tra un
    # run e l'altro (niente storico/trend), ma sufficiente come quality gate
    # su ogni push/PR. Per uno storico persistente valutare in futuro
    # SonarCloud oppure un'istanza SonarQube self-hosted permanente.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube usa la history git per il blame delle issue

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compila classi e test backend (senza rieseguire i test, già verdi nel job "backend")
        working-directory: backend
        run: mvn -B test-compile

      - name: Scarica il report di coverage backend (JaCoCo, dal job "backend")
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco

      - name: Scarica il report di coverage frontend (lcov, dal job "frontend")
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/healthcare-frontend

      - name: Scarica il report di coverage agente (dal job "agent")
        uses: actions/download-artifact@v4
        with:
          name: agent-coverage-report
          path: agent

      - name: Prerequisiti host per l'Elasticsearch embedded in SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072
          ulimit -n 131072

      - name: Avvia SonarQube Community Build
        run: |
          docker run -d --name sonarqube -p 9000:9000 sonarqube:community
          echo "In attesa che SonarQube sia pronto (1-2 minuti)..."
          timeout 180 bash -c '
            until curl -s http://localhost:9000/api/system/status | grep -q "\"status\":\"UP\""; do
              sleep 5
            done
          '

      - name: Genera un token di analisi (credenziali di default, istanza effimera)
        id: sonar-token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-$(date +%s)" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Analisi SonarQube (backend + frontend + agent in un'unica scansione)
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar-token.outputs.token }}

      - name: Ferma il container SonarQube
        if: always()
        run: docker stop sonarqube && docker rm sonarqube
