name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Rileva quali moduli sono stati modificati ─────────────────────────────
  # Ogni modulo procede in modo indipendente: build → test → release, solo
  # se contiene file modificati in questo push/PR.
  changes:
    name: "Rileva moduli modificati"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            agent:
              - 'agent/**'

  # ═══════════════════════════════ BACKEND ════════════════════════════════════
  build-backend:
    name: "Backend — Build"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compila e pacchettizza (senza test)
        working-directory: backend
        run: mvn -B clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  test-backend:
    name: "Backend — Test"
    needs: [changes, build-backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Esegui test (JUnit)
        working-directory: backend
        run: mvn -B test

  release-backend:
    name: "Backend — Release"
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Calcola numero di versione
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release
      - name: Crea tag e GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-v${{ steps.version.outputs.version }}
          name: "Backend v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/*.jar

  # ═══════════════════════════════ FRONTEND ═══════════════════════════════════
  build-frontend:
    name: "Frontend — Build"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze
        working-directory: frontend
        run: npm install
      - name: Build di produzione
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  test-frontend:
    name: "Frontend — Test"
    needs: [changes, build-frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze
        working-directory: frontend
        run: npm install
      - name: Esegui test (Karma headless)
        working-directory: frontend
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessCI

  release-frontend:
    name: "Frontend — Release"
    needs: [changes, test-frontend]
    if: needs.changes.outputs.frontend == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Calcola numero di versione
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Comprimi artefatto frontend
        working-directory: release/frontend
        run: zip -r ../frontend-dist.zip .
      - name: Crea tag e GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frontend-v${{ steps.version.outputs.version }}
          name: "Frontend v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/frontend-dist.zip

  # ═══════════════════════════════ AGENTE AI ══════════════════════════════════
  build-agent:
    name: "Agente AI — Build"
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installa dipendenze
        working-directory: agent
        run: pip install -r requirements.txt
      - name: Pacchettizza agente (zip sorgenti + requirements)
        run: zip -r agent-package.zip agent -x "agent/__pycache__/*" "agent/**/__pycache__/*" "agent/tests/*"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-package
          path: agent-package.zip
          retention-days: 1

  test-agent:
    name: "Agente AI — Test"
    needs: [changes, build-agent]
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Installa dipendenze
        working-directory: agent
        run: pip install -r requirements.txt
      - name: Esegui test (pytest, modalità offline)
        working-directory: agent
        env:
          OPENAI_API_KEY: ""
        run: pytest -v

  release-agent:
    name: "Agente AI — Release"
    needs: [changes, test-agent]
    if: needs.changes.outputs.agent == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Calcola numero di versione
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: agent-package
          path: release
      - name: Crea tag e GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ steps.version.outputs.version }}
          name: "Agente AI v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/agent-package.zip
