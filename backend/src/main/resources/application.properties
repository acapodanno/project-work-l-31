# Server port
server.port=8080

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:healthcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT: il secret è condiviso con l'agente AI (agent/.env, variabile JWT_SECRET),
# che valida lo stesso token per proteggere /api/chat. In produzione va
# sovrascritto con HEALTHCARE_JWT_SECRET e allineato su entrambi i servizi.
healthcare.jwt.secret=${HEALTHCARE_JWT_SECRET:SecretKeyForHealthcarePlusAppMustBeAtLeast32BytesLongForSecurityReasons}
