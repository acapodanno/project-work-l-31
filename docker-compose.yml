# Orchestrazione dei tre servizi in locale (o su qualunque host con Docker).
#
# Avvio:            docker compose up --build
# Solo i test:      docker compose -f docker-compose.test.yml up --build
# Coverage estratta su host: vedi i commenti nei singoli Dockerfile
#                   (target `test` + `docker build --output type=local,...`).

services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent:
    build:
      context: ./agent
      target: runtime
    ports:
      - "5000:5000"
    environment:
      # Dentro la rete Docker i servizi si raggiungono per nome, non per
      # localhost: "backend" risolve all'IP del container backend.
      BACKEND_URL: http://backend:8080/api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "4200:80"
    depends_on:
      - backend
      - agent
