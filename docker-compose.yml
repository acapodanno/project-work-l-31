# Orchestrazione dei tre servizi in locale (o su qualunque host con Docker).
#
# Avvio:            docker compose up --build
services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "4200:80"
    depends_on:
      - backend
