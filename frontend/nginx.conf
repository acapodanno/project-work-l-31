# Configurazione Nginx per servire la SPA Angular.
# `try_files` con fallback su index.html è necessaria per il routing
# lato client di Angular Router (altrimenti un refresh su /dashboard
# darebbe 404, perché quel path non esiste come file fisico).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lunga per gli asset con hash nel nome file (prodotti da Angular
    # con outputHashing: all), cache nulla per index.html così i deploy
    # successivi sono visibili subito.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
