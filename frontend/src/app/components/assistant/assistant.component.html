<div class="chat-container glass-panel shadow-xl flex flex-col h-[600px] max-w-4xl mx-auto overflow-hidden">
  
  <!-- CHAT HEADER -->
  <div class="flex items-center justify-between p-5 border-b border-slate-200 bg-white">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-blue-100 text-blue-700 rounded-xl flex items-center justify-center">
        <span class="material-symbols-outlined text-2xl">smart_toy</span>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-800 leading-tight">Assistente Virtuale</h2>
        <span class="text-xs text-emerald-600 flex items-center space-x-1.5 mt-0.5">
          <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full inline-block animate-ping"></span>
          <span>Pronto a rispondere</span>
        </span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded-full px-3 py-1 font-medium">Supporto AI</span>
      <button
        type="button"
        class="btn btn-secondary text-xs"
        title="Cancella la cronologia della conversazione"
        (click)="onClearHistory()">
        <span class="material-symbols-outlined text-sm leading-none">delete_sweep</span>
      </button>
    </div>
  </div>

  <!-- MESSAGES AREA -->
  <div class="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50">
    <app-chat-message 
      *ngFor="let msg of chatMessages" 
      [message]="msg">
    </app-chat-message>
    
    <!-- TYPING INDICATOR -->
    <div class="flex max-w-[80%] space-x-3 items-start mr-auto" *ngIf="chatLoading">
      <div class="w-8 h-8 rounded-lg bg-slate-200 text-slate-600 flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-lg animate-pulse">smart_toy</span>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 flex items-center space-x-1.5 h-10 shadow-sm">
        <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-75"></span>
        <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-150"></span>
        <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-300"></span>
      </div>
    </div>
  </div>

  <!-- INPUT AREA (WITH SUGGESTIONS) -->
  <app-chat-input
    [chatLoading]="chatLoading"
    [showPatientSuggestions]="authService.getRole() === 'PATIENT'"
    (send)="onSend($event)">
  </app-chat-input>

</div>
