<div class="border-t border-slate-200 bg-white p-4">
  <div class="flex flex-wrap gap-2 mb-3" *ngIf="showPatientSuggestions">
    <button
      type="button"
      class="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded-full px-3 py-1.5 hover:bg-blue-100 transition"
      (click)="sendSuggestion('Vorrei prenotare una visita')">
      Vorrei prenotare una visita
    </button>
    <button
      type="button"
      class="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded-full px-3 py-1.5 hover:bg-blue-100 transition"
      (click)="sendSuggestion('Quali sono i miei prossimi appuntamenti?')">
      I miei prossimi appuntamenti
    </button>
    <button
      type="button"
      class="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded-full px-3 py-1.5 hover:bg-blue-100 transition"
      (click)="sendSuggestion('Ho bisogno di assistenza')">
      Ho bisogno di assistenza
    </button>
  </div>

  <form class="flex items-center gap-3" (ngSubmit)="sendMessage()">
    <input
      type="text"
      name="newMessageText"
      placeholder="Scrivi un messaggio..."
      [(ngModel)]="newMessageText"
      [disabled]="chatLoading"
      autocomplete="off" />
    <button
      type="submit"
      class="btn btn-primary flex-shrink-0"
      [disabled]="chatLoading || !newMessageText.trim()">
      <span class="material-symbols-outlined text-lg leading-none">send</span>
    </button>
  </form>
</div>
