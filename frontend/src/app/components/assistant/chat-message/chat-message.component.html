<div
  class="flex max-w-[80%] space-x-3 items-start"
  [ngClass]="message.sender === 'user' ? 'ml-auto flex-row-reverse space-x-reverse' : 'mr-auto'">
  <div
    class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
    [ngClass]="message.sender === 'user' ? 'bg-blue-700 text-white' : 'bg-slate-200 text-slate-600'">
    <span class="material-symbols-outlined text-lg">
      {{ message.sender === 'user' ? 'person' : 'smart_toy' }}
    </span>
  </div>
  <div
    class="px-4 py-3 shadow-sm text-sm leading-relaxed whitespace-pre-line rounded-2xl"
    [ngClass]="message.sender === 'user'
      ? 'bg-blue-700 text-white rounded-tr-none'
      : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none'">
    {{ message.text }}
  </div>
</div>
