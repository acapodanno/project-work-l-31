<div class="glass-card p-6 max-w-xl mx-auto space-y-5">
  <div class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center flex-shrink-0">
      <span class="material-symbols-outlined">event_available</span>
    </div>
    <div>
      <h2 class="text-base font-bold text-slate-800">Prenota con {{ selectedDoctor.name }}</h2>
      <span class="text-xs text-blue-700 font-medium">{{ selectedDoctor.specialization }}</span>
    </div>
  </div>

  <div class="rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-3 text-sm font-medium" *ngIf="bookingSuccess">
    Prenotazione effettuata con successo!
  </div>
  <div class="rounded-xl bg-red-50 text-red-700 border border-red-200 px-4 py-3 text-sm font-medium" *ngIf="bookingError">
    {{ bookingError }}
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-4" *ngIf="!bookingSuccess">
    <div>
      <label for="appointmentDate">Data e ora appuntamento</label>
      <input
        id="appointmentDate"
        type="datetime-local"
        name="appointmentDate"
        [(ngModel)]="appointmentDate"
        required />
    </div>
    <div>
      <label for="appointmentReason">Motivo della visita</label>
      <input
        id="appointmentReason"
        type="text"
        name="appointmentReason"
        placeholder="Es. controllo periodico"
        [(ngModel)]="appointmentReason"
        required />
    </div>
    <div>
      <label for="appointmentNotes">Note (opzionale)</label>
      <textarea
        id="appointmentNotes"
        name="appointmentNotes"
        rows="3"
        placeholder="Eventuali informazioni aggiuntive"
        [(ngModel)]="appointmentNotes"></textarea>
    </div>
    <div>
      <label for="appointmentFile">Allega documento (opzionale)</label>
      <input id="appointmentFile" type="file" (change)="onFileSelected($event)" />
      <p class="text-xs text-slate-500 mt-1" *ngIf="selectedFile">{{ selectedFile.name }}</p>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="button" class="btn btn-secondary flex-1" (click)="back.emit()">Indietro</button>
      <button type="submit" class="btn btn-primary flex-1">Conferma prenotazione</button>
    </div>
  </form>
</div>
