<div class="space-y-5">
  <div class="relative">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">search</span>
    <input
      type="text"
      style="padding-left: 2.5rem;"
      placeholder="Cerca per nome o specializzazione..."
      name="searchQuery"
      [(ngModel)]="searchQuery" />
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div
      class="glass-card p-5 cursor-pointer"
      *ngFor="let doc of filteredDoctors"
      (click)="onSelect(doc)">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-11 h-11 rounded-xl bg-[var(--bg-subtle)] text-[var(--color-secondary-text)] flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined">stethoscope</span>
        </div>
        <div>
          <h3 class="text-sm font-bold text-[var(--text-primary)]">{{ doc.name }}</h3>
          <span class="text-xs text-[var(--color-secondary-text)] font-medium">{{ doc.specialization }}</span>
        </div>
      </div>
      <p class="text-xs text-[var(--text-secondary)]" *ngIf="doc.experienceYears">
        {{ doc.experienceYears }} anni di esperienza
      </p>

      <div class="mt-2" *ngIf="hasAvailabilityInfo(doc.id)">
        <span class="badge badge-completed" *ngIf="nextAvailableSlot(doc.id) as slot">
          Primo slot libero: {{ slot.date | date:'dd/MM' }} · {{ slot.startTime.substring(0,5) }}
        </span>
        <span class="badge badge-open" *ngIf="!nextAvailableSlot(doc.id)">
          Nessuno slot nei prossimi giorni
        </span>
      </div>

      <button class="btn btn-secondary w-full mt-4 text-sm">
        Vedi dettagli
      </button>
    </div>
  </div>

  <div class="empty-state" *ngIf="filteredDoctors.length === 0">
    <span class="material-symbols-outlined empty-state-icon">search_off</span>
    <p>Nessun medico trovato per "{{ searchQuery }}".</p>
  </div>
</div>
