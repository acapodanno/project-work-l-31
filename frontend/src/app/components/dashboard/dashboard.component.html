<div class="space-y-9">
  <!-- Ogni sotto-dashboard (Patient/Doctor/Support) ha ormai una propria intestazione in stile CareOps:
       il saluto condiviso che stava qui è stato rimosso perché sarebbe sempre duplicato. -->
  <app-dashboard-patient
    *ngIf="authService.getRole() === 'PATIENT'"
    [appointments]="appointments"
    [tickets]="tickets"
    [currentPatient]="currentPatient"
    (navigate)="onNavigate($event)"
    (viewReportEvent)="viewReport($event)"
    (cancelAppointment)="onCancelAppointment($event)"
    (editAppointment)="onEditAppointment($event)">
  </app-dashboard-patient>

  <app-dashboard-doctor
    *ngIf="authService.getRole() === 'DOCTOR'"
    [appointments]="appointments"
    (statusChange)="onStatusChange($event)"
    (viewReportEvent)="viewReport($event)"
    (editAppointment)="onEditAppointment($event)"
    (refreshRequested)="onRefreshRequested()">
  </app-dashboard-doctor>

  <app-dashboard-support
    *ngIf="authService.getRole() === 'SUPPORT'"
    [appointments]="appointments"
    [tickets]="tickets"
    [doctors]="doctors"
    (statusChange)="onStatusChange($event)"
    (ticketStatusChange)="onTicketStatusChange($event)">
  </app-dashboard-support>

  <app-report-viewer
    *ngIf="selectedReport"
    [report]="selectedReport"
    [isDoctor]="authService.getRole() === 'DOCTOR'"
    (close)="closeReportViewer()"
    (saveNotes)="saveDoctorNotes($event)">
  </app-report-viewer>
</div>
