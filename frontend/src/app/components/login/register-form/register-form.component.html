<div class="glass-card p-8 max-w-md w-full mx-auto">
  <h2 class="text-xl font-bold text-slate-800 mb-1">Crea un account</h2>
  <p class="text-sm text-slate-500 mb-6">Registrati per prenotare le tue visite</p>

  <app-alert type="error" [message]="registerError" class="block mb-4"></app-alert>

  <form (ngSubmit)="register()" class="space-y-4">
    <div>
      <label for="registerName">Nome e cognome</label>
      <input
        id="registerName"
        type="text"
        name="registerName"
        placeholder="Mario Rossi"
        [(ngModel)]="registerName"
        required />
    </div>
    <div>
      <label for="registerEmail">Email</label>
      <input
        id="registerEmail"
        type="email"
        name="registerEmail"
        placeholder="mario.rossi@email.com"
        [(ngModel)]="registerEmail"
        required />
    </div>
    <div>
      <label for="registerPhone">Telefono</label>
      <input
        id="registerPhone"
        type="tel"
        name="registerPhone"
        placeholder="+39 333 1234567"
        [(ngModel)]="registerPhone" />
    </div>
    <div>
      <label for="registerPassword">Password</label>
      <input
        id="registerPassword"
        type="password"
        name="registerPassword"
        placeholder="••••••••"
        [(ngModel)]="registerPassword"
        required />
    </div>

    <button type="submit" class="btn btn-primary w-full">
      <span class="material-symbols-outlined text-lg leading-none">person_add</span>
      Registrati
    </button>
  </form>

  <p class="text-sm text-slate-500 text-center mt-6">
    Hai già un account?
    <a class="text-blue-700 font-semibold cursor-pointer" (click)="goToLogin.emit()">Accedi</a>
  </p>
</div>
