<div class="glass-card p-8 max-w-md w-full mx-auto">
  <h2 class="text-xl font-bold text-[var(--text-primary)] mb-1">Verifica in due passaggi</h2>
  <p class="text-sm text-[var(--text-secondary)] mb-6">
    Inserisci il codice OTP inviato per <strong>{{ loginEmail }}</strong>
  </p>

  <app-alert type="error" [message]="loginError" class="block mb-4"></app-alert>

  <form (ngSubmit)="verify2fa()" class="space-y-4">
    <div>
      <label for="twoFaCode">Codice OTP</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] !text-lg pointer-events-none">pin</span>
        <input
          id="twoFaCode"
          type="text"
          name="twoFaCode"
          class="!pl-10 tracking-[0.3em] font-semibold"
          placeholder="123456"
          inputmode="numeric"
          maxlength="6"
          [(ngModel)]="twoFaCode"
          required />
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-full">
      <span class="material-symbols-outlined text-lg leading-none">verified</span>
      Verifica
    </button>
    <button type="button" class="btn btn-secondary w-full" (click)="goBack.emit()">
      Torna al login
    </button>
  </form>
</div>
