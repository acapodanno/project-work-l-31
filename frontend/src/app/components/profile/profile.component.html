<div class="max-w-md mx-auto">
  <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-8 shadow-xl text-center">
    
    <!-- HEADER -->
    <div class="flex flex-col items-center mb-6">
      <div class="w-24 h-24 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-5xl">person</span>
      </div>
      
      <h2 class="text-2xl font-bold text-white mb-2">{{ currentPatient?.name || 'Account Utente' }}</h2>
      <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-500/20 text-blue-300 border border-blue-500/30">
        {{ authService.getRole() }}
      </span>
    </div>

    <!-- DETAILS -->
    <div class="space-y-4 text-left border-t border-b border-white/10 py-6 mb-6">
      <div class="flex justify-between items-center text-sm">
        <span class="text-slate-400 font-medium">Email</span>
        <span class="text-white font-semibold">{{ authService.getEmail() }}</span>
      </div>
      <div class="flex justify-between items-center text-sm" *ngIf="currentPatient?.name">
        <span class="text-slate-400 font-medium">Nome</span>
        <span class="text-white font-semibold">{{ currentPatient?.name }}</span>
      </div>
      <div class="flex justify-between items-center text-sm" *ngIf="currentPatient?.phone">
        <span class="text-slate-400 font-medium">Telefono</span>
        <span class="text-white font-semibold">{{ currentPatient?.phone }}</span>
      </div>
      <div class="flex justify-between items-center text-sm" *ngIf="authService.getProfileId()">
        <span class="text-slate-400 font-medium">ID Profilo</span>
        <span class="text-white font-semibold">#{{ authService.getProfileId() }}</span>
      </div>
    </div>

    <!-- ACTIONS -->
    <button 
      class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-red-500/20 active:scale-[0.98] transition-all"
      (click)="onLogout()">
      Disconnetti
    </button>

  </div>
</div>
