<div class="space-y-3">
  <div class="glass-card p-4" *ngFor="let therapy of therapies">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h3 class="text-sm font-bold text-slate-800">{{ therapy.description }}</h3>
        <p class="text-xs text-slate-500 mt-1" *ngIf="therapy.doctor">
          Prescritta da {{ therapy.doctor.name }}
        </p>
      </div>
      <span class="badge badge-scheduled flex-shrink-0">
        {{ therapy.startDate | date:'dd/MM/yyyy' }} - {{ therapy.endDate | date:'dd/MM/yyyy' }}
      </span>
    </div>
  </div>

  <div class="empty-state" *ngIf="therapies.length === 0">
    <span class="material-symbols-outlined empty-state-icon">medication</span>
    <p>Nessuna terapia prescritta al momento.</p>
  </div>
</div>
