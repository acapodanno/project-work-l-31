<div
  *ngIf="message"
  class="flex items-start gap-3 rounded-xl px-4 py-3 text-sm font-medium border fade-in"
  [ngClass]="{
    'bg-red-50 text-red-700 border-red-200': type === 'error',
    'bg-emerald-50 text-emerald-700 border-emerald-200': type === 'success',
    'bg-[var(--bg-subtle)] text-[var(--color-secondary-text)] border-[var(--border-color)]': type === 'info'
  }">
  <span class="material-symbols-outlined text-lg leading-none">
    {{ type === 'error' ? 'error' : (type === 'success' ? 'check_circle' : 'info') }}
  </span>
  <span>{{ message }}</span>
</div>
