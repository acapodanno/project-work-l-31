# Configurazione SonarQube per l'analisi multi-modulo del monorepo
# (backend Java, frontend Angular/TypeScript).
# Ogni modulo corrisponde a una sottocartella reale del repository.

sonar.projectKey=healthcare-plus
sonar.projectName=HealthCare Plus

sonar.modules=backend,frontend

# --- Backend (Java / Spring Boot) ---
backend.sonar.projectName=Backend (Spring Boot)
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Frontend (Angular / TypeScript) ---
frontend.sonar.projectName=Frontend (Angular)
frontend.sonar.sources=src/app
frontend.sonar.tests=src/app
frontend.sonar.test.inclusions=**/*.spec.ts
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**
frontend.sonar.javascript.lcov.reportPaths=coverage/healthcare-frontend/lcov.info
